<!DOCTYPE html>
<html lang="en" ng-app="birthdayApp">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Birthday Event</title>

    <!-- Bootstrap CSS -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">

    <!-- AngularJS -->
    <script src="https://ajax.googleapis.com/ajax/libs/angularjs/1.8.2/angular.min.js"></script>

    <style>
        body{
            background: linear-gradient(to right, #ff758c, #ff7eb3);
            font-family: Arial, sans-serif;
        }

        .event-card{
            background: white;
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0px 8px 20px rgba(0,0,0,0.2);
            margin-top: 60px;
        }

        .title{
            color: #ff4081;
            font-weight: bold;
            font-size: 45px;
        }

        .countdown{
            font-size: 28px;
            font-weight: bold;
            color: #ff4081;
        }

        .btn-custom{
            background: #ff4081;
            color: white;
            border-radius: 25px;
            padding: 10px 25px;
        }

        .btn-custom:hover{
            background: #e73370;
            color: white;
        }
       .guest-list li{
            font-size: 18px;
            padding: 5px;
        }
    </style>
</head>

<body ng-controller="BirthdayController">

<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-8">

            <div class="event-card text-center">

                <div class="balloon">🎈🎂🎉🎈</div>

                <h1 class="title">Birthday Event</h1>

                <p class="fs-5 mt-3">
                    Welcome to {{name}}'s Birthday Celebration
                </p>

                <hr>

                <h4> Event Details</h4>

                <p>
                    <strong>Date:</strong> {{date}} <br>
                    <strong>Time:</strong> {{time}} <br>
                    <strong>Venue:</strong> {{venue}}
                </p>

                <hr>
                 <h2>chief guest</h2>

                <strong><p> Mrs.Keerthika and Mr.Ravi</p></strong>
                

                <hr>

                <h4> Guest List(my friends)</h4>

                <ul class="list-group guest-list">
                    <li class="list-group-item" 
                    ng-repeat="guest in guests">
                        {{guest}}
                    </li>
                </ul>

                <button class="btn btn-custom mt-4"
                ng-click="showMessage()">
                    Join Party
                </button>

                <p class="mt-3 text-success fw-bold">
                    {{message}}
                </p>

            </div>

        </div>
    </div>
</div>

<script>

var app = angular.module("birthdayApp", []);

app.controller("BirthdayController", function($scope, $interval){

    $scope.name = "Deva";
    $scope.date = "30 august 2006";
    $scope.time = "11:00 AM";
    $scope.venue = "Golden Party Hall";

    $scope.guests = [
        "Kanishka",
        "Tharani",
        "Shanmathi",
        "Dharshini",
        "Narmatha",
        "Nivetha"
    ];

    $scope.message = "";

    $scope.showMessage = function(){
        $scope.message = "🎉 Thanks for joining the birthday party!";
    };

    // Countdown Timer
    var eventDate = new Date("June 10, 2026 18:00:00").getTime();

    $interval(function(){

        var now = new Date().getTime();

        var distance = eventDate - now;

        var days = Math.floor(distance / (1000 * 60 * 60 * 24));
        var hours = Math.floor((distance % (1000 * 60 * 60 * 24))
                    / (1000 * 60 * 60));

        var minutes = Math.floor((distance % (1000 * 60 * 60))
                    / (1000 * 60));

        var seconds = Math.floor((distance % (1000 * 60))
                    / 1000);

        $scope.countdown =
            days + " Days " +
            hours + " Hours " +
            minutes + " Minutes " +
            seconds + " Seconds ";

    },1000);

});

</script>

</body>
</html>
